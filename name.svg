<svg xmlns="http://www.w3.org/2000/svg" width="820" height="200" viewBox="0 0 820 200" role="img" aria-label="Raaju Pahlowan, iOS Developer" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="1" stop-color="#3c8bd6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <text x="410" y="38" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" letter-spacing="6" fill="#00e5ff">MOBILE APP DEVELOPER (iOS)</text>
  <text x="410" y="118" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="78" font-weight="800" letter-spacing="-2" fill="url(#g)" filter="url(#glow)">Raaju Pahlowan</text>
  <rect x="330" y="140" width="160" height="3" rx="1.5" fill="url(#g)">
    <animate attributeName="width" values="40;160;40" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="x" values="390;330;390" dur="4s" repeatCount="indefinite"/>
  </rect>
  <text x="410" y="178" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" letter-spacing="2" fill="#4a7fa8">Swift  ·  SwiftUI  ·  UIKit  ·  Dhaka, Bangladesh</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
